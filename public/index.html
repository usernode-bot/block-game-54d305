<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script>
  // usernode-dev-console@1
  (function () {
    if (window.__usernodeDevConsole) return;
    window.__usernodeDevConsole = true;
    var S = '__usernodeDevConsole';
    function serialize(v, depth) {
      depth = depth || 0;
      try {
        if (v === undefined) return 'undefined';
        if (v === null) return 'null';
        if (typeof v === 'string') return v;
        if (typeof v === 'number' || typeof v === 'boolean') return String(v);
        if (typeof v === 'function') return '[Function ' + (v.name || 'anonymous') + ']';
        if (v instanceof Error) return (v.stack || (v.name + ': ' + v.message));
        if (depth > 3) return '[…]';
        var seen = new WeakSet();
        return JSON.stringify(v, function (k, val) {
          if (typeof val === 'object' && val !== null) {
            if (seen.has(val)) return '[Circular]';
            seen.add(val);
          }
          if (typeof val === 'function') return '[Function ' + (val.name || 'anonymous') + ']';
          if (val instanceof Error) return val.stack || (val.name + ': ' + val.message);
          return val;
        });
      } catch (e) { try { return String(v); } catch (_) { return '[unserializable]'; } }
    }
    function post(level, args, meta) {
      try {
        var payload = {
          sentinel: S,
          level: level,
          args: Array.prototype.slice.call(args).map(function (a) { return serialize(a); }),
          ts: Date.now(),
          url: location.href,
        };
        if (meta) for (var k in meta) payload[k] = meta[k];
        if (window.parent && window.parent !== window) {
          window.parent.postMessage(payload, '*');
        }
      } catch (_) {}
    }
    ['log','info','warn','error','debug'].forEach(function (level) {
      var orig = console[level] ? console[level].bind(console) : function () {};
      console[level] = function () { post(level, arguments); orig.apply(null, arguments); };
    });
    window.addEventListener('error', function (e) {
      var msg = (e.error && (e.error.stack || e.error.message)) || e.message || 'Error';
      post('error', [msg], { source: e.filename || '', line: e.lineno || 0, col: e.colno || 0, kind: 'error' });
    });
    window.addEventListener('unhandledrejection', function (e) {
      var r = e.reason;
      var msg = (r && (r.stack || r.message)) || String(r);
      post('error', [msg], { kind: 'unhandledrejection' });
    });
    try { post('info', ['[dev-console ready]'], { kind: 'ready' }); } catch (_) {}
  })();
  </script>
  <title>block-game</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='45' fill='%237c3aed'/><circle cx='50' cy='50' r='18' fill='white'/></svg>">
  <!-- Tailwind, PRECOMPILED for this app (was cdn.tailwindcss.com's
       in-browser engine plus an inline tailwind.config here). The config
       moved to tailwind.config.js in the repo root; npm run build compiles
       it to public/tailwind.css with Docker or Paketo on every image build, so the
       stylesheet is regenerated from THIS commit's markup every deploy and
       can never drift behind the code. ~7 KB of CSS instead of a ~400 KB
       engine, and no flash of unstyled content.
       Writing class names as whole literals is what keeps this working — a
       class assembled from fragments at runtime (e.g. "bg-" + tone + "-500")
       is invisible to the compiler. If you genuinely need runtime-generated
       classes, swap this link for the platform-hosted engine instead:
       <script src="/usernode-tailwind/v1/tailwind.js"></script> -->
  <link rel="stylesheet" href="/tailwind.css">
  <!-- The platform bridge, centrally hosted and loaded by RELATIVE path (the
       handler in server.js serves it under a plain "node server.js"; the
       platform's edge answers it everywhere else). Never vendor it and never
       write a hostname in front of it.
       It is NOT conditional on this app calling a bridge API: it is also how
       the app ANSWERS the shell, so a scaffold without it is invisible to
       anything that asks the frame a question. Offline launch is one of those.
       Another is the page's colour: the bridge reports this document's opaque
       ground to the shell (#1581), which is what makes the platform bar above
       the app take the app's tone instead of the viewer's theme (#1945).
       The bridge is also where the app learns the viewer's light/dark theme:
       the script below reads it. -->
  <script src="/usernode-bridge/v1/bridge.js"></script>
  <!-- Follow the viewer's Homeroom theme (the bridge reports it), with the
       OS preference as the fallback outside Homeroom. The 3D scene does NOT
       follow it — the world is the game's own scenery with one fixed daytime
       look; only this HUD chrome follows the theme. -->
  <script>
    (function () {
      var media = window.matchMedia('(prefers-color-scheme: dark)');
      function applyTheme() {
        var theme = (window.usernode && window.usernode.theme) || (media.matches ? 'dark' : 'light');
        document.documentElement.classList.toggle('dark', theme === 'dark');
        document.documentElement.style.colorScheme = theme;
      }
      applyTheme();
      window.addEventListener('usernode:theme-changed', applyTheme);
      media.addEventListener('change', applyTheme);
    })();
  </script>
</head>
<body class="bg-stone-100 text-stone-800 dark:bg-stone-950 dark:text-stone-200">
  <!-- The whole screen is the world. The 3D scene is the game's own scenery,
       so it keeps one fixed look in both themes; the HUD chrome below it
       carries the light/dark variants. -->
  <div class="fixed inset-0 overflow-hidden select-none">
    <canvas id="game" class="block w-full h-full touch-none"></canvas>

    <!-- Crosshair: the aim point everything else serves. Replaced by the
         session-expired message when the token has died. -->
    <div id="crosshair" class="absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 pointer-events-none" aria-hidden="true">
      <svg class="w-5 h-5 text-white drop-shadow" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M10 3v14M3 10h14" />
      </svg>
    </div>
    <div id="expired" class="hidden absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 pointer-events-none rounded-lg bg-stone-900/80 text-stone-50 text-sm px-4 py-2">
      Session expired — reload the page
    </div>

    <!-- Name of the block in the selected slot. -->
    <div id="block-name" class="absolute bottom-24 left-1/2 -translate-x-1/2 pointer-events-none rounded-md bg-stone-200/80 text-stone-800 text-sm font-medium px-3 py-1 dark:bg-stone-900/80 dark:text-stone-100" aria-live="polite"></div>

    <!-- Hotbar: the palette tray, built slot by slot from the same palette
         data game.js renders the blocks with. Slots are chunky squares with
         a raised border look; the selected one gets the grass-green accent. -->
    <div class="absolute bottom-4 left-1/2 -translate-x-1/2">
      <div id="hotbar" class="flex gap-1 rounded-xl border-2 border-stone-300 bg-stone-200/90 p-1 shadow-lg dark:border-stone-700 dark:bg-stone-900/90" role="toolbar" aria-label="Hotbar"></div>
    </div>

    <!-- Shown whenever the mouse is NOT locked (Esc, before first click).
         The hints carry the words the game uses: Place, Break, Hotbar slot. -->
    <div id="overlay" class="absolute inset-0 flex items-center justify-center bg-stone-900/50">
      <div class="rounded-2xl border border-stone-300 bg-stone-100 px-8 py-6 text-center max-w-sm dark:border-stone-700 dark:bg-stone-900">
        <h1 id="overlay-title" class="text-xl font-bold text-stone-900 dark:text-stone-50">Click to build</h1>
        <p id="overlay-note" class="mt-1 text-sm text-stone-600 dark:text-stone-300">Your mouse will steer the camera.</p>
        <dl id="overlay-hints" class="mt-4 space-y-1.5 text-sm text-stone-700 dark:text-stone-300">
          <div class="flex justify-between gap-6"><dt class="text-stone-500 dark:text-stone-400">Move</dt><dd>W A S D</dd></div>
          <div class="flex justify-between gap-6"><dt class="text-stone-500 dark:text-stone-400">Rise / sink</dt><dd>Space / Shift</dd></div>
          <div class="flex justify-between gap-6"><dt class="text-stone-500 dark:text-stone-400">Place</dt><dd>Left-click</dd></div>
          <div class="flex justify-between gap-6"><dt class="text-stone-500 dark:text-stone-400">Break</dt><dd>Right-click</dd></div>
          <div class="flex justify-between gap-6"><dt class="text-stone-500 dark:text-stone-400">Hotbar slot</dt><dd>1–8 or wheel</dd></div>
          <div class="flex justify-between gap-6"><dt class="text-stone-500 dark:text-stone-400">Release mouse</dt><dd>Esc</dd></div>
        </dl>
      </div>
    </div>

    <!-- Touch devices: this version needs a mouse and keyboard. -->
    <div id="touch-card" class="hidden absolute inset-0 flex items-center justify-center bg-stone-900/50">
      <div class="rounded-2xl border border-stone-300 bg-stone-100 px-8 py-6 text-center max-w-sm dark:border-stone-700 dark:bg-stone-900">
        <h1 class="text-xl font-bold text-stone-900 dark:text-stone-50">Open block-game on a computer to build</h1>
        <p class="mt-1 text-sm text-stone-600 dark:text-stone-300">This version needs a mouse and keyboard.</p>
      </div>
    </div>
  </div>

  <script type="module" src="/game.js"></script>
</body>
</html>
